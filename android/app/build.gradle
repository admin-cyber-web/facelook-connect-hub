apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv("KEYSTORE_PATH")
def releaseKeystorePass = System.getenv("KEYSTORE_PASS")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPass = System.getenv("KEY_PASS")
def releaseSigningConfigured = releaseKeystorePath && releaseKeystorePass && releaseKeyAlias && releaseKeyPass
def missingReleaseSigningMessage =
    "Cannot build a release APK without signing env vars. Set KEYSTORE_PATH, KEYSTORE_PASS, KEY_ALIAS, and KEY_PASS."
def isReleaseArtifactTaskName = { taskName ->
    taskName.tokenize(':').last() ==~ /^(assemble|bundle|package).*Release$/
}

if (!releaseSigningConfigured && gradle.startParameter.taskNames.any { isReleaseArtifactTaskName(it) }) {
    throw new GradleException(missingReleaseSigningMessage)
}

android {
    namespace "com.flicks.hub"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.flicks.hub"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile      file(releaseKeystorePath)
                storePassword releaseKeystorePass
                keyAlias      releaseKeyAlias
                keyPassword   releaseKeyPass
            } else {
                project.logger.warn(
                    "Release signing is not configured. Debug builds will use the standard debug keystore; release APK tasks require KEYSTORE_PATH, KEYSTORE_PASS, KEY_ALIAS, and KEY_PASS."
                )
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseArtifactTask = taskGraph.allTasks.find { task ->
        task.name ==~ /^(assemble|bundle|package).*Release$/
    }
    if (releaseArtifactTask && !releaseSigningConfigured) {
        throw new GradleException(missingReleaseSigningMessage)
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    
    // Added JUnit and Test dependencies to resolve compilation issues
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion "1.8.22"
        }
    }
}