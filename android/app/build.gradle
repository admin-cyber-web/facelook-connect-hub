apply plugin: 'com.android.application'

android {
    namespace "com.flicks.hub"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.flicks.hub"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            def keystorePass = System.getenv("KEYSTORE_PASS")
            def keyAlias_    = System.getenv("KEY_ALIAS")
            def keyPass      = System.getenv("KEY_PASS")
            if (!keystorePath || !keystorePass || !keyAlias_ || !keyPass) {
                throw new GradleException(
                    "Missing signing env vars. Set KEYSTORE_PATH, KEYSTORE_PASS, KEY_ALIAS, KEY_PASS."
                )
            }
            storeFile     file(keystorePath)
            storePassword keystorePass
            keyAlias      keyAlias_
            keyPassword   keyPass
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$rootProject.ext.androidxSwipeRefreshLayoutVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion "1.8.22"
        }
    }
}
